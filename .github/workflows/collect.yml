name: עדכון קטלוג מוצרים

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests lxml
      - run: python collect.py
      - run: python prices.py
        continue-on-error: true
      - name: save
        if: always()
        run: |
          git config user.name "salkal-bot"
          git config user.email "bot@salkal.invalid"
          git add -A
          git diff --cached --quiet || git commit -m "catalog update"
          git push
